name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 编译
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          ./build.ps1 -Clean

      - name: 检查产物
        shell: pwsh
        run: |
          $exe = 'dist/DesktopIconToggle.exe'
          if (-not (Test-Path $exe)) { throw "没有生成 $exe" }
          Get-Item $exe | Format-List Name, Length, LastWriteTime

      - uses: actions/upload-artifact@v4
        with:
          name: DesktopIconToggle
          path: dist/DesktopIconToggle.exe
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: DesktopIconToggle
          path: out

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
          # 这个 job 没有 checkout，目录里没有 .git，gh 无法自己推断是哪个仓库，
          # 必须显式指定，否则会报 "not a git repository" 并以 exit 1 失败。
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # 产物解压后的相对路径不写死，直接找，避免以后路径规则变化再踩坑
          ls -R out
          exe=$(find out -type f -name 'DesktopIconToggle.exe' | head -n 1)
          if [ -z "$exe" ]; then
            echo "::error::artifact 里找不到 DesktopIconToggle.exe"
            exit 1
          fi
          echo "uploading: $exe"

          # 幂等：这个 tag 上已经有 Release（例如在网页上手动建的）就只传附件；
          # 没有才创建。创建失败也容忍（可能是并发/可见性延迟），交给上传去报真正的错。
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes || true
          fi
          gh release upload "${GITHUB_REF_NAME}" "${exe}#DesktopIconToggle.exe" --clobber
